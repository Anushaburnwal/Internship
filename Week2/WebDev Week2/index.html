<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 2 Practice Questions</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-wrap">
      <main class="assignment-panel">
        <header class="header-block">
          <h1>WEEK 2 – CSS + Basic JavaScript</h1>
        </header>

        <section class="focus-block">
          <h2>ANY- ONE</h2>
          <p class="focus-text">Focus: Interactivity + Animations Assignment</p>
        </section>

        <section class="question-block">
          <h3>1:</h3>
          <h4>Interactive Image Gallery</h4>

          <ul class="task-list">
            <li>Show 6–8 images in a grid</li>
            <li>When clicked → open in lightbox view (bigger size)</li>
            <li>Add hover animations</li>
          </ul>

          <div class="gallery" id="gallery" aria-label="Interactive image gallery"></div>
        </section>

        <p class="skill-line">Skill Gain: DOM manipulation, event handling.</p>
      </main>
    </div>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <div class="lightbox-content">
        <button class="close-btn" id="closeLightbox" aria-label="Close image">×</button>
        <img id="lightboxImage" src="" alt="Selected gallery item" />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
